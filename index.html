<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#6D3FD0;
  --accent2:#2F6BFF;
  --bg:#F7F5FF;
  --ink:#1E1B3A;
  --muted:#6f6b8f;
  --card:#FFFFFF;
  --gold:#DCE8FF;
  --line:#E3DEF7;
}
*{box-sizing:border-box;margin:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:90px}
h1,h2,.brand{font-family:'Bricolage Grotesque','Nunito',sans-serif}
header{padding:34px 20px 26px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:0 0 34px 34px;text-align:center}
.brand{font-size:clamp(30px,8vw,48px);font-weight:800;letter-spacing:-.02em}
.by{margin-top:4px;font-weight:600;font-size:14px;opacity:.9}
.k{display:inline-block;margin-top:12px;background:#fff;color:var(--accent);padding:4px 14px;border-radius:99px;font-weight:700;font-size:13px}
.tag{max-width:460px;margin:6px auto 0;opacity:.92}
.welcome{display:inline-block;margin-top:16px;background:rgba(255,255,255,.16);padding:8px 16px;border-radius:99px;font-size:14px;font-weight:600}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.tools{margin:22px 0 14px;display:flex;flex-direction:column;gap:12px}
input[type=search]{width:100%;padding:13px 18px;border:2px solid var(--line);border-radius:99px;font:inherit;background:#fff;color:var(--ink)}
input[type=search]:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:#fff;color:var(--ink);padding:7px 16px;border-radius:99px;font:600 14px 'Nunito',sans-serif;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;border:1px solid var(--line);transition:transform .15s}
.card:active{transform:scale(.98)}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pic{position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,#E6DEFF,#D6E6FF);display:flex;align-items:center;justify-content:center;font-size:44px}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.title{font-weight:700;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:17px;color:var(--accent)}
.buy{margin-top:auto;background:var(--ink);color:#fff;text-align:center;padding:9px;border-radius:12px;font-weight:700;font-size:14px}
.empty{text-align:center;padding:50px 10px;color:var(--muted)}
.note{margin:34px auto 0;max-width:520px;text-align:center;font-size:13px;color:var(--muted)}
.wa{position:fixed;right:16px;bottom:16px;background:#25D366;color:#fff;text-decoration:none;font-weight:700;padding:13px 20px;border-radius:99px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand" id="name"></div>
  <div class="by" id="by"></div>
  <p class="tag" id="tagline"></p>
  <div><span class="k">Shop Kilimall deals</span></div>
  <span class="welcome" id="welcome"></span>
</header>
<main class="wrap">
  <div class="tools">
    <input type="search" id="q" placeholder="Search products" aria-label="Search products">
    <div class="chips" id="chips"></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="note" id="note"></p>
</main>
<a class="wa" id="wa" target="_blank" rel="noopener" hidden>Chat with us</a>

<script src="config.js"></script>
<script>
const S = window.SHOP || {};
const P = (S.products || []).filter(p => p.link).map(p => ({ ...p, d: {} }));
const $ = id => document.getElementById(id);
let cat = "All", term = "";

if (S.accent) document.documentElement.style.setProperty('--accent', S.accent);
if (S.accent2) document.documentElement.style.setProperty('--accent2', S.accent2);
document.title = S.name || "Shop";
$('name').textContent = S.name || "Shop";
$('by').textContent = S.owner ? 'Curated by ' + S.owner : '';
$('tagline').textContent = S.tagline || "";
$('welcome').textContent = S.welcome || "";
if (!S.welcome) $('welcome').hidden = true;
if (S.disclosure) $('note').textContent = "Orders are placed and delivered by Kilimall. We may earn a small commission when you buy through our links, at no extra cost to you." + (S.owner ? " Thank you for supporting " + S.owner + "." : "");
if (S.whatsapp) {
  $('wa').hidden = false;
  $('wa').href = "https://wa.me/" + S.whatsapp + "?text=" + encodeURIComponent(S.whatsappText || "");
}

const cats = ["All", ...new Set(P.map(p => p.category).filter(Boolean))];
const chips = $('chips');
if (cats.length <= 2) chips.hidden = true;
cats.forEach(c => {
  const b = document.createElement('button');
  b.className = 'chip' + (c === cat ? ' on' : '');
  b.textContent = c;
  b.onclick = () => { cat = c; [...chips.children].forEach(x => x.classList.toggle('on', x === b)); render(); };
  chips.appendChild(b);
});
$('q').oninput = e => { term = e.target.value.toLowerCase().trim(); render(); };

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
const view = p => ({
  title: p.title || p.d.title || "Product on Kilimall",
  image: p.image || p.d.image || "",
  price: p.price || p.d.price || ""
});

// image fails: try our proxy once, then fall back to the placeholder
function imgFail(el) {
  const src = el.getAttribute('src') || '';
  if (/^https:/.test(src) && !el.dataset.tried) {
    el.dataset.tried = 1;
    el.src = '/api/img?u=' + encodeURIComponent(src);
  } else el.remove();
}

function render() {
  const list = P.map(p => ({ p, v: view(p) }))
    .filter(({ p, v }) => (cat === "All" || p.category === cat) && (!term || v.title.toLowerCase().includes(term)));
  $('grid').innerHTML = list.length ? list.map(({ p, v }) => `
    <a class="card" href="${esc(p.link)}" target="_blank" rel="noopener sponsored">
      <div class="pic">🛍️${v.image ? `<img src="${esc(v.image)}" alt="${esc(v.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this)">` : ""}${p.tag ? `<span class="badge">${esc(p.tag)}</span>` : ""}</div>
      <div class="info">
        <div class="title">${esc(v.title)}</div>
        ${v.price ? `<div class="price">${esc(v.price)}</div>` : ""}
        <div class="buy">View on Kilimall</div>
      </div>
    </a>`).join("") : `<div class="empty" style="grid-column:1/-1">Nothing found. Try another word or category.</div>`;
}

async function load(p) {
  const key = "qs:" + p.link;
  try {
    const c = sessionStorage.getItem(key);
    if (c) { p.d = JSON.parse(c); return; }
  } catch (e) {}
  try {
    const r = await fetch('/api/preview?url=' + encodeURIComponent(p.link));
    if (!r.ok) return;
    p.d = await r.json();
    try { sessionStorage.setItem(key, JSON.stringify(p.d)); } catch (e) {}
  } catch (e) {}
}

render();
Promise.all(P.filter(p => !(p.title && p.image && p.price)).map(load)).then(render);
</script>
</body>
</html>
