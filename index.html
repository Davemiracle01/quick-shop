<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --accent:#6D3FD0;
  --accent2:#2F6BFF;
  --bg:#F7F5FF;
  --ink:#1E1B3A;
  --muted:#6f6b8f;
  --card:#FFFFFF;
  --gold:#DCE8FF;
  --line:#E3DEF7;
}
*{box-sizing:border-box;margin:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:90px}
h1,h2,.brand{font-family:'Bricolage Grotesque','Nunito',sans-serif}
header{padding:34px 20px 26px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:0 0 34px 34px;text-align:center}
.brand{font-size:clamp(30px,8vw,48px);font-weight:800;letter-spacing:-.02em}
.by{margin-top:4px;font-weight:600;font-size:14px;opacity:.9}
.k{display:inline-block;margin-top:12px;background:#fff;color:var(--accent);padding:4px 14px;border-radius:99px;font-weight:700;font-size:13px}
.tag{max-width:460px;margin:6px auto 0;opacity:.92}
.welcome{display:inline-block;margin-top:16px;background:rgba(255,255,255,.16);padding:8px 16px;border-radius:99px;font-size:14px;font-weight:600}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.tools{position:sticky;top:0;z-index:5;margin:0 -16px 14px;padding:12px 16px;background:rgba(247,245,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
select{border:2px solid var(--line);border-radius:99px;padding:0 12px;font:600 14px 'Nunito',sans-serif;background:#fff;color:var(--ink)}
.wrap>.grid{margin-top:4px}
input[type=search]{width:100%;padding:13px 18px;border:2px solid var(--line);border-radius:99px;font:inherit;background:#fff;color:var(--ink)}
input[type=search]:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:#fff;color:var(--ink);padding:7px 16px;border-radius:99px;font:600 14px 'Nunito',sans-serif;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{content-visibility:auto;contain-intrinsic-size:auto 300px;background:var(--card);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;border:1px solid var(--line);transition:transform .15s}
.card:active{transform:scale(.98)}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pic{position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,#E6DEFF,#D6E6FF);display:flex;align-items:center;justify-content:center;font-size:44px}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.pic img.ok{opacity:1}
.sk .title,.sk .price{background:linear-gradient(90deg,#ece8fb 25%,#f6f4ff 50%,#ece8fb 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:6px;color:transparent}
.sk .title{height:38px}.sk .price{height:20px;width:60%}
@keyframes sh{to{background-position:-200% 0}}
#more{height:1px}
.badge{position:absolute;top:10px;left:10px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.title{font-weight:700;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:17px;color:var(--accent)}
.buy{margin-top:auto;background:var(--ink);color:#fff;text-align:center;padding:9px;border-radius:12px;font-weight:700;font-size:14px}
.empty{text-align:center;padding:50px 10px;color:var(--muted)}
.note{margin:34px auto 0;max-width:520px;text-align:center;font-size:13px;color:var(--muted)}
.wa{position:fixed;right:16px;bottom:16px;background:#25D366;color:#fff;text-decoration:none;font-weight:700;padding:13px 20px;border-radius:99px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand" id="name"></div>
  <div class="by" id="by"></div>
  <p class="tag" id="tagline"></p>
  <div><span class="k">Shop Kilimall deals</span></div>
  <span class="welcome" id="welcome"></span>
</header>
<main class="wrap">
  <div class="tools">
    <div class="row"><input type="search" id="q" placeholder="Search products" aria-label="Search products"><select id="sort" aria-label="Sort"><option value="">Sort</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option></select></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div id="more"></div>
  <p class="note" id="note"></p>
</main>
<a class="wa" id="wa" target="_blank" rel="noopener" hidden>Chat with us</a>

<script src="config.js"></script>
<script>
const S = window.SHOP || {};
const P = (S.products || []).filter(p => p.link).map((p, i) => ({ ...p, i, d: {}, el: null }));
const $ = id => document.getElementById(id);
const PAGE = 12, CHUNK = 8, TTL = 6 * 3600e3, KEY = 'qs3:';
let cat = "All", term = "", sort = "", shown = PAGE, pending = 0;

if (S.accent) document.documentElement.style.setProperty('--accent', S.accent);
if (S.accent2) document.documentElement.style.setProperty('--accent2', S.accent2);
document.title = S.name || "Shop";
$('name').textContent = S.name || "Shop";
$('by').textContent = S.owner ? 'Curated by ' + S.owner : '';
$('tagline').textContent = S.tagline || "";
$('welcome').textContent = S.welcome || "";
if (!S.welcome) $('welcome').hidden = true;
if (S.disclosure) $('note').textContent = "Orders are placed and delivered by Kilimall. We may earn a small commission when you buy through our links, at no extra cost to you." + (S.owner ? " Thank you for supporting " + S.owner + "." : "");
if (S.whatsapp) {
  $('wa').hidden = false;
  $('wa').href = "https://wa.me/" + S.whatsapp + "?text=" + encodeURIComponent(S.whatsappText || "");
}

const cats = ["All", ...new Set(P.map(p => p.category).filter(Boolean))];
const chips = $('chips');
if (cats.length <= 2) chips.hidden = true;
cats.forEach(c => {
  const b = document.createElement('button');
  b.className = 'chip' + (c === cat ? ' on' : '');
  b.textContent = c;
  b.onclick = () => { cat = c; shown = PAGE; [...chips.children].forEach(x => x.classList.toggle('on', x === b)); render(); };
  chips.appendChild(b);
});
let t;
$('q').oninput = e => { clearTimeout(t); t = setTimeout(() => { term = e.target.value.toLowerCase().trim(); shown = PAGE; render(); }, 120); };
$('sort').onchange = e => { sort = e.target.value; shown = PAGE; render(); };

const view = p => {
  const title = p.title || p.d.title || "";
  return {
    title, ready: !!title || p.failed,
    image: p.image || p.d.image || "",
    price: p.price || p.d.price || "",
    n: p.d.n || parseFloat(String(p.price || '').replace(/[^\d.]/g, '')) || 0
  };
};

function imgFail(el) {
  const src = el.getAttribute('src') || '';
  if (/^https:/.test(src) && !el.dataset.tried) {
    el.dataset.tried = 1;
    el.src = '/api/img?u=' + encodeURIComponent(src);
  } else el.remove();
}

function card(p) {
  if (p.el) return p.el;
  const a = document.createElement('a');
  a.className = 'card';
  a.href = p.link; a.target = '_blank'; a.rel = 'noopener sponsored';
  a.innerHTML = '<div class="pic">🛍️</div><div class="info"><div class="title"></div><div class="price"></div><div class="buy">View on Kilimall</div></div>';
  if (p.tag) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = p.tag; a.firstChild.appendChild(b); }
  p.el = a;
  paint(p);
  return a;
}

function paint(p) {
  const a = p.el; if (!a) return;
  const v = view(p);
  a.classList.toggle('sk', !v.ready);
  a.querySelector('.title').textContent = v.ready ? (v.title || "Product on Kilimall") : "";
  const pr = a.querySelector('.price');
  pr.textContent = v.price;
  pr.hidden = v.ready && !v.price;
  if (v.image && p.imgSrc !== v.image) {
    p.imgSrc = v.image;
    const pic = a.firstChild;
    const old = pic.querySelector('img'); if (old) old.remove();
    const im = new Image();
    im.alt = v.title || "Product";
    im.decoding = 'async';
    im.referrerPolicy = 'no-referrer';
    if (p.i < 4) im.fetchPriority = 'high'; else im.loading = 'lazy';
    im.onload = () => im.classList.add('ok');
    im.onerror = () => imgFail(im);
    im.src = v.image;
    pic.appendChild(im);
  }
}

const io = new IntersectionObserver(es => {
  if (es[0].isIntersecting) { shown += PAGE; render(); }
}, { rootMargin: '800px' });
io.observe($('more'));

function render() {
  let list = P.filter(p => (cat === "All" || p.category === cat) && (!term || view(p).title.toLowerCase().includes(term)));
  if (sort) {
    const k = p => view(p).n || (sort === 'lo' ? Infinity : -1);
    list = [...list].sort((a, b) => sort === 'lo' ? k(a) - k(b) : k(b) - k(a));
  }
  const g = $('grid');
  const nodes = list.slice(0, shown).map(card);
  if (!nodes.length) {
    const e = document.createElement('div');
    e.className = 'empty'; e.style.gridColumn = '1/-1';
    e.textContent = pending && term ? 'Still loading products…' : 'Nothing found. Try another word or category.';
    g.replaceChildren(e);
  } else g.replaceChildren(...nodes);
  $('more').hidden = shown >= list.length;
}

// ---- data: localStorage cache + chunked parallel loading ----
P.forEach(p => {
  try {
    const c = JSON.parse(localStorage.getItem(KEY + p.link));
    if (c && c.d) { p.d = c.d; p.t = c.t; }
  } catch (e) {}
});

const todo = P.filter(p => !(p.title && p.image && p.price) && !(p.t && Date.now() - p.t < TTL));
const chunks = [];
for (let i = 0; i < todo.length; i += CHUNK) chunks.push(todo.slice(i, i + CHUNK));
pending = todo.length;

async function runChunk(ch, retry) {
  let out = [];
  try {
    const r = await fetch('/api/batch?u=' + encodeURIComponent(ch.map(p => p.link).join('|')));
    if (r.ok) out = await r.json();
  } catch (e) {}
  const failed = [];
  ch.forEach((p, i) => {
    const d = out[i];
    if (d && (d.title || d.image)) {
      p.d = d; p.t = Date.now(); p.failed = false;
      try { localStorage.setItem(KEY + p.link, JSON.stringify({ d, t: p.t })); } catch (e) {}
    } else if (!p.d.title) failed.push(p);
    paint(p);
  });
  if (failed.length && !retry) return runChunk(failed, true);
  failed.forEach(p => { p.failed = true; paint(p); });
  pending -= ch.length;
  if (term || sort) render();
}

async function worker() { while (chunks.length) await runChunk(chunks.shift()); }

render();
// first chunk gets the full pipe, the rest load 2 at a time
if (chunks.length) { worker(); worker(); worker(); }
</script>
</body>
</html>
